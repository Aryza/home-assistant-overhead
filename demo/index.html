<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overhead · Home Assistant preview</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e9eef1;font:15px system-ui;color:#22333d}header{max-width:1200px;margin:0 auto 24px}h1{font-size:32px;margin:8px 0}p{line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1200px;margin:auto}section{min-width:0}section>h2{font-size:15px;font-weight:500;letter-spacing:.06em}overhead-card{border-radius:14px;overflow:hidden;box-shadow:0 8px 32px #1c344411}section:last-child{grid-column:1/-1}@media(max-width:700px){body{padding:14px}.grid{grid-template-columns:1fr;gap:16px}}</style><header><small>OVERHEAD / HOME ASSISTANT</small><h1>A view of the aircraft above you</h1><p>Four original layouts adapted for your dashboard. This offline preview uses synthetic positions and a simple aircraft illustration. It makes no live API calls.</p></header><div class="grid"></div><script type="module">
import '../custom_components/overhead/frontend/overhead-card.js';
const data=await(await fetch('./data.json')).json();window.mode='normal';window.cards=[];
const hass={user:{is_admin:true},async callWS(msg){if(msg.type==='overhead/entries')return[{entry_id:'demo',name:'Berlin demo'}];if(msg.type==='overhead/metadata')return{styles:{poster:'Vintage poster'}};if(msg.type==='overhead/manage')return {items:[],used_cents:0,cap_cents:100,generation_enabled:false,catalogue:{airframes:23,painted:0,passes:56,estimate:34},profiles:[]};const d=structuredClone(data[msg.options.view]);if(window.mode==='empty')Object.assign(d,{state:'empty',aircraft:[]});if(window.mode==='error')Object.assign(d,{state:'error',error:'Feed unavailable'});return d;}};
for(const [view,title]of Object.entries({photo:'01 · Photo',plate:'02 · Plate',cluster:'03 · Cluster',scene:'04 · Scene',management:'Your collection'})){const s=document.createElement('section');const h=document.createElement('h2');h.textContent=title;s.append(h);const c=document.createElement('overhead-card');c.dataset.view=view;c.setConfig({type:'custom:overhead-card',entry_id:'demo',profile_id:'demo_'+view,view,height:390});s.append(c);document.querySelector('.grid').append(s);c.hass=hass;window.cards.push(c);}
</script></html>
