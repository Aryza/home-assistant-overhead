name: Integration validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ['2026.10.2', '2026.11.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install supported Home Assistant and test runner
        run: python -m pip install homeassistant==${{ matrix.homeassistant }} pytest==9.1.1
      - name: Check runtime requirements against Home Assistant constraints
        run: python -m pytest tests/test_dependencies.py -q
      - name: Resolve fresh runtime dependencies under Home Assistant constraints
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          from importlib.resources import files

          manifest = json.loads(Path('custom_components/overhead/manifest.json').read_text())
          subprocess.run([
              sys.executable, '-m', 'uv', 'pip', 'install', '--dry-run',
              '--python', sys.executable,
              '--constraint', str(files('homeassistant').joinpath('package_constraints.txt')),
              *manifest['requirements'],
          ], check=True)
          PY
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate integration repository
        uses: hacs/action@main
        with:
          category: integration
